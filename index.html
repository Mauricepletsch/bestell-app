<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/assets.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/basket.css">
    <script src="scripts/db.js"></script>
    <script src="script.js"></script>
    <script src="scripts/templates.js"></script>
</head>

<body onload="init()">

    <header></header>

    <section class="hero">
        <img src="assets/img/hero.webp" alt="Burger, Pizza und Pommes auf einem Holztisch">
        <div class="logo"></div>
        <h1>BurgerHouse</h1>
    </section>

    <main>
        <div class="content">
            <div class="menu">
                <h2 class="category">Burger</h2>
                <div id="burger" class="dishes"></div>

                <h2 class="category">Pizza</h2>
                <div id="pizza" class="dishes"></div>

                <h2 class="category">Salat</h2>
                <div id="salad" class="dishes"></div>
            </div>

            <div id="basket"></div>
        </div>
    </main>

    <footer></footer>
</body>

</html>
